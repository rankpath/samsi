<style>
:root{
  --surface:#F0EEE9; --raised:#FFFFFF; --sunken:#E6E3DC; --border:#D6D2C8;
  --ink:#14161C; --muted:#4E5364; --accent:#1E3FCB; --quiet:#E2E6F7; --accent-text:#FFFFFF;
  --shift:200ms cubic-bezier(.2,.7,.3,1);
  --lead:1.58; --display-track:-.03em; --display-lead:1.02;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:'Inter Tight',system-ui,sans-serif; font-size:16.5px; line-height:var(--lead);
  -webkit-font-smoothing:antialiased;
  transition:background var(--shift),color var(--shift);
}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;
  letter-spacing:var(--display-track);line-height:var(--display-lead);margin:0;}
p{margin:0;}
a{color:var(--accent-ink);text-decoration:none;border-bottom:1.5px solid currentColor;}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px;}

/* ---------- Thai overrides ---------- */
html[lang="th"]{--lead:1.8;--display-track:0;--display-lead:1.28;}
html[lang="th"] body{font-family:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;font-size:17.5px;letter-spacing:0;}
html[lang="th"] h1,html[lang="th"] h2,html[lang="th"] h3{font-family:'Anuphan',sans-serif;font-weight:700;letter-spacing:0;}
html[lang="th"] .wordmark{font-family:'Bricolage Grotesque',sans-serif;}
html[lang="th"] .hex,html[lang="th"] .ratio,html[lang="th"] .pv-code{font-family:'Inter Tight',sans-serif;}
html[lang="th"] .ratio{letter-spacing:-.03em;}
html[lang="th"] .btn,html[lang="th"] .chip,html[lang="th"] .cat,html[lang="th"] .pv-btn{letter-spacing:0;}

.shell{max-width:1160px;margin:0 auto;padding:0 28px;}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px 0 0;flex-wrap:wrap;}
.wordmark{display:flex;align-items:center;gap:11px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.04em;}
.logo{display:block;flex:none;}   /* brand mark keeps its own colours in every theme */
.mast-right{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.mast nav{display:flex;gap:22px;font-size:14.5px;color:var(--muted);}
.mast nav a{color:inherit;border:none;}
.mast nav a:hover{color:var(--ink);}
.langsw{display:flex;border:1.5px solid var(--border);border-radius:2px;overflow:hidden;transition:border-color var(--shift);}
.langsw button{
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;
  color:var(--muted);padding:6px 13px;transition:background 140ms,color 140ms;
}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface);}
.langsw button:first-child{font-family:'IBM Plex Sans Thai',sans-serif;}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;padding:72px 0 26px;align-items:start;}
.hero h1{font-size:clamp(40px,6vw,78px);}
.hero h1 span{display:block;color:var(--accent);transition:color var(--shift);}
.lede{margin-top:26px;font-size:19px;color:var(--muted);max-width:46ch;}
html[lang="th"] .lede{font-size:18px;max-width:42ch;}
.hero-actions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;}
.btn{font:inherit;font-weight:600;font-size:15.5px;border:none;cursor:pointer;
  padding:13px 22px;border-radius:3px;background:var(--accent);color:var(--accent-text);
  transition:background var(--shift),color var(--shift),transform 120ms;}
.btn:hover{transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border);}
.btn.ghost:hover{border-color:var(--accent);}

.stack{border:1.5px solid var(--border);background:var(--raised);transition:background var(--shift),border-color var(--shift);}
.band{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:15px 18px;font-size:13.5px;font-weight:500;transition:background var(--shift),color var(--shift);}
.band .role{opacity:.85;}
.band .hex{font-variant-numeric:tabular-nums;font-weight:600;}
.stack-foot{padding:14px 18px;border-top:1.5px solid var(--border);font-size:13px;
  color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

/* ---------- rail ---------- */
.rail-wrap{padding:14px 0 54px;}
.rail-label{font-size:13.5px;color:var(--muted);margin-bottom:12px;}
.rail{display:flex;gap:8px;flex-wrap:wrap;}
.chip{cursor:pointer;border:1.5px solid var(--border);background:var(--raised);font:inherit;font-size:14px;
  color:var(--ink);padding:8px 14px 8px 10px;border-radius:2px;display:flex;align-items:center;gap:9px;
  transition:border-color 140ms,background 140ms;}
.chip:hover{border-color:var(--ink);}
.chip[aria-pressed="true"]{border-color:var(--accent);border-width:2px;padding:7px 13px 7px 9px;background:var(--quiet);}
.chip i{width:15px;height:15px;border-radius:50%;display:block;}

/* ---------- sections ---------- */
section{padding:60px 0;border-top:1.5px solid var(--border);transition:border-color var(--shift);}
.sec-head{max-width:58ch;margin-bottom:34px;}
.sec-head h2{font-size:clamp(27px,3.4vw,40px);}
.sec-head p{margin-top:14px;color:var(--muted);}

.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.meter{border:1.5px solid var(--border);padding:17px 18px;background:var(--raised);transition:background var(--shift),border-color var(--shift);}
.meter .pair{font-size:13.5px;color:var(--muted);}
.meter .ratio{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;
  letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.1;}
.verdict{font-size:12.5px;font-weight:600;margin-top:4px;display:inline-block;padding:2px 8px;border-radius:2px;}
.pass{background:#DCEFE3;color:#11543A;} .warn{background:#FAEBD2;color:#6B4A0B;} .fail{background:#F7DEDB;color:#8A1F1A;}
.bar{height:5px;background:var(--sunken);margin-top:12px;position:relative;overflow:hidden;}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width 260ms ease,background var(--shift);}

.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px;}
.cat{cursor:pointer;font:inherit;font-size:14px;padding:7px 13px;border-radius:2px;
  border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all 140ms;}
.cat:hover{color:var(--ink);border-color:var(--ink);}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);}
.preview{display:grid;grid-template-columns:1.1fr 1fr;border:1.5px solid var(--border);transition:border-color var(--shift);}
.pv-site{padding:34px 32px;transition:background var(--shift),color var(--shift);}
.pv-site h3{font-size:26px;margin-bottom:11px;}
.pv-site .pv-sub{font-size:14.5px;margin-bottom:20px;opacity:.82;max-width:36ch;}
.pv-btn{display:inline-block;padding:11px 19px;border-radius:3px;font-size:14.5px;font-weight:600;}
.pv-note{margin-top:22px;font-size:12.5px;opacity:.7;max-width:40ch;}
.pv-code{padding:28px 30px;background:var(--sunken);font-size:13.2px;line-height:1.85;transition:background var(--shift);}
.pv-code .k{color:var(--muted);}
.pv-code .row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dotted var(--border);padding:2px 0;}
.pv-code .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.14);}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:26px;}
.step{padding-top:16px;border-top:3px solid var(--accent);transition:border-color var(--shift);}
.step .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;color:var(--accent-ink);transition:color var(--shift);}
html[lang="th"] .step .n{font-family:'Anuphan',sans-serif;}
.step h3{font-size:19px;margin:7px 0 8px;}
.step p{font-size:14.5px;color:var(--muted);}

.cta{background:var(--accent);color:var(--accent-text);padding:56px 46px;margin:66px 0 0;transition:background var(--shift),color var(--shift);}
.cta h2{font-size:clamp(28px,4vw,46px);max-width:20ch;}
.cta p{margin-top:16px;opacity:.88;max-width:48ch;}
.cta .btn{background:var(--accent-text);color:var(--accent);margin-top:28px;}

footer{padding:34px 0 56px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;}

@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.reveal{animation:rise .62s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i)*70ms);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}html{scroll-behavior:auto;}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:38px;padding-top:44px;}
  .preview{grid-template-columns:1fr;}
  .cta{padding:40px 26px;}
  .shell{padding:0 20px;}
  .mast nav{display:none;}
}
</style>
</head>

<div class="shell">

  <section id="categories">

      <p data-t="s2p"></p>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Categories"></div>
    <div class="preview">
      <div class="pv-site" id="pvSite">
        <h3 id="pvTitle"></h3>
        <p class="pv-sub" id="pvSub"></p>
        <span class="pv-btn" id="pvBtn"></span>
        <p class="pv-note" id="pvNote"></p>
      </div>
      <div class="pv-code" id="pvCode"></div>
    </div>
  </section>

  <section id="how">
    <div class="sec-head">
      <h2 data-t="s3h"></h2>
      <p data-t="s3p"></p>
    </div>
    <div class="steps" id="steps"></div>
  </section>
</div>

<div class="shell">
  <div class="cta">
    <h2 data-t="ctaH"></h2>
    <p data-t="ctaP"></p>
    <button class="btn" id="ctaBottom" data-t="ctaBtn"></button>
  </div>
  <footer>
    <span data-t="footA"></span>
    <span data-t="footB"></span>
  </footer>
</div>

<script>
/* ---------------- colour maths ---------------- */
const lum=h=>{h=h.replace('#','');
  const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];};
const ratio=(a,b)=>{const l=[lum(a),lum(b)].sort((x,y)=>y-x);return (l[0]+0.05)/(l[1]+0.05);};
const bestText=bg=>ratio('#FFFFFF',bg)>=ratio('#14161C',bg)?'#FFFFFF':'#14161C';
/* link colour: the accent itself when it clears 4.5:1 on the surface, otherwise the ink */
const textSafe=(accent,surface)=>ratio(accent,surface)>=4.5?accent:getComputedStyle(root).getPropertyValue('--ink').trim()||'#14161C';

/* ---------------- state ---------------- */
const root=document.documentElement;
let lang='th', current=THEMES[0], catIndex=2;

function applyTheme(t){
  current=t;
  const inv=bestText(t.accent);
  const map={'--surface':t.surface,'--raised':t.raised,'--sunken':t.sunken,'--border':t.border,
             '--ink':t.ink,'--muted':t.muted,'--accent':t.accent,'--quiet':t.quiet,'--accent-text':inv};
  for(const k in map) root.style.setProperty(k,map[k]);
  root.style.setProperty('--accent-ink', textSafe(t.accent,t.surface));
  document.getElementById('themeName').textContent=t.name;
  document.getElementById('themeOrigin').textContent=t.origin[lang];
  document.getElementById('heroLine').textContent=t.line[lang];
  drawStack(t); drawMeters(t,inv);
  document.querySelectorAll('#rail .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.name===t.name)));
}

function drawStack(t){
  const L=T[lang].bands;
  const rows=[[L[0],t.surface,t.surface,t.ink],[L[1],t.raised,t.raised,t.ink],
    [L[2],t.ink,t.ink,t.surface],[L[3],t.muted,t.muted,t.surface],
    [L[4],t.accent,t.accent,bestText(t.accent)],[L[5],t.quiet,t.quiet,bestText(t.quiet)]];
  const foot=document.querySelector('.stack-foot');
  document.querySelectorAll('.band').forEach(b=>b.remove());
  rows.forEach(([role,hex,bg,fg])=>{
    const d=document.createElement('div');
    d.className='band'; d.style.background=bg; d.style.color=fg;
    d.innerHTML=`<span class="role"></span><span class="hex">${hex.toUpperCase()}</span>`;
    d.querySelector('.role').textContent=role;
    document.querySelector('#stack').insertBefore(d,foot);
  });
}

function drawMeters(t,inv){
  const L=T[lang];
  const set=[[L.meters[0],ratio(t.ink,t.surface),4.5],[L.meters[1],ratio(t.muted,t.surface),4.5],
             [L.meters[2],ratio(inv,t.accent),4.5],[L.meters[3],ratio(t.accent,t.surface),3]];
  document.getElementById('meters').innerHTML=set.map(([label,r,min])=>{
    let cls,txt;
    if(r>=min){cls='pass';txt=L.vPass(min);}
    else if(r>=min-1.5){cls='warn';txt=L.vWarn;}
    else {cls='fail';txt=L.vFail(min);}
    const w=Math.min(100,(r/12)*100);
    return `<div class="meter"><div class="pair">${label}</div>
      <div class="ratio">${r.toFixed(2)}:1</div>
      <span class="verdict ${cls}">${txt}</span>
      <div class="bar"><i style="width:${w}%"></i></div></div>`;
  }).join('');
}

function drawCat(i){
  catIndex=i;
  const c=CATS[i], inv=bestText(c.accent), L=T[lang];
  const site=document.getElementById('pvSite');
  site.style.background=c.surface; site.style.color=c.ink;
  document.getElementById('pvTitle').textContent=c.t[lang];
  document.getElementById('pvSub').textContent=c.s[lang];
  const btn=document.getElementById('pvBtn');
  btn.textContent=c.b[lang]; btn.style.background=c.accent; btn.style.color=inv;
  document.getElementById('pvNote').textContent=c.n[lang];
  const rows=[['surface',c.surface],['ink',c.ink],['ink-muted',c.muted],['accent',c.accent],['accent-quiet',c.quiet]];
  document.getElementById('pvCode').innerHTML=
    rows.map(([k,v])=>`<div class="row"><span class="k">--${k}</span><span><span class="sw" style="background:${v}"></span>${v.toUpperCase()}</span></div>`).join('')
    +`<div class="row" style="border:none;margin-top:10px"><span class="k">${L.inkOn}</span><span>${ratio(c.ink,c.surface).toFixed(1)}:1</span></div>`
    +`<div class="row" style="border:none"><span class="k">${L.btnOn}</span><span>${ratio(inv,c.accent).toFixed(1)}:1</span></div>`;
  document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i)));
}

function drawSteps(){
  document.getElementById('steps').innerHTML=T[lang].steps.map(([n,h,p])=>
    `<div class="step"><div class="n">${n}</div><h3>${h}</h3><p>${p}</p></div>`).join('');
}

function setLang(l){
  lang=l;
  root.setAttribute('lang',l);
  document.title=T[l].title;
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=T[l][el.dataset.t]; });
  document.getElementById('btnTh').setAttribute('aria-pressed',String(l==='th'));
  document.getElementById('btnEn').setAttribute('aria-pressed',String(l==='en'));
  document.querySelectorAll('#cats .cat').forEach((b,i)=>{ b.textContent=CATS[i].c[l]; });
  drawSteps(); applyTheme(current); drawCat(catIndex);
}

/* build static lists */
document.getElementById('rail').innerHTML=THEMES.map(t=>
 `<button class="chip" data-name="${t.name}" aria-pressed="false"><i style="background:${t.accent};border:1px solid ${t.border}"></i>${t.name}</button>`).join('');
document.querySelectorAll('#rail .chip').forEach(c=>
 c.addEventListener('click',()=>applyTheme(THEMES.find(t=>t.name===c.dataset.name))));

document.getElementById('cats').innerHTML=CATS.map((c,i)=>
 `<button class="cat" data-i="${i}" aria-pressed="${i===2}"></button>`).join('');
document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>drawCat(+b.dataset.i)));

document.getElementById('btnTh').addEventListener('click',()=>setLang('th'));
document.getElementById('btnEn').addEventListener('click',()=>setLang('en'));
document.getElementById('randomBtn').addEventListener('click',()=>{
  let t; do{ t=THEMES[Math.floor(Math.random()*THEMES.length)]; } while(t.name===current.name);
  applyTheme(t);
});
['ctaTop','ctaBottom'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{
  document.getElementById('check').scrollIntoView({block:'start'});
}));

setLang('th');
</script>
</body>
</html>
