<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Pattern — 2027 palette demo</title><style>
body{margin:0;background:#F0EEE9;color:#14161C;font:16px/1.55 system-ui,sans-serif;padding:28px;}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em;}
p{margin:0 0 6px;color:#4E5364;font-size:14px;}
.chips{display:flex;gap:6px;margin:14px 0 26px;}
.chips span{width:34px;height:34px;border-radius:3px;border:1px solid rgba(0,0,0,.14);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;}
figure{margin:0;}
.tile{height:190px;border:1px solid #D6D2C8;border-radius:3px;background-size:100px 100px;background-repeat:repeat;}
figcaption{font-size:13px;color:#4E5364;margin-top:7px;}
</style></head><body>
<h1>Colour Pattern — 2027 palette demo</h1><p>Each swatch is one 200×200 tile repeating at 100px. Seams should be invisible.</p>
<div class="chips"><span style="background:#F0EEE9"></span><span style="background:#1E3FCB"></span><span style="background:#EBB13C"></span><span style="background:#8B4A33"></span><span style="background:#6F9B55"></span></div><div class="grid"><figure><div class="tile" style="background-image:url(dots.svg)"></div><figcaption>dots</figcaption></figure><figure><div class="tile" style="background-image:url(scatter.svg)"></div><figcaption>scatter</figcaption></figure><figure><div class="tile" style="background-image:url(stripes.svg)"></div><figcaption>stripes</figcaption></figure><figure><div class="tile" style="background-image:url(grid.svg)"></div><figcaption>grid</figcaption></figure><figure><div class="tile" style="background-image:url(checker.svg)"></div><figcaption>checker</figcaption></figure><figure><div class="tile" style="background-image:url(terrazzo.svg)"></div><figcaption>terrazzo</figcaption></figure><figure><div class="tile" style="background-image:url(waves.svg)"></div><figcaption>waves</figcaption></figure><figure><div class="tile" style="background-image:url(scallop.svg)"></div><figcaption>scallop</figcaption></figure><figure><div class="tile" style="background-image:url(crosses.svg)"></div><figcaption>crosses</figcaption></figure><figure><div class="tile" style="background-image:url(triangles.svg)"></div><figcaption>triangles</figcaption></figure><figure><div class="tile" style="background-image:url(arcs.svg)"></div><figcaption>arcs</figcaption></figure><figure><div class="tile" style="background-image:url(herringbone.svg)"></div><figcaption>herringbone</figcaption></figure><figure><div class="tile" style="background-image:url(chevron.svg)"></div><figcaption>chevron</figcaption></figure></div></body></html>
